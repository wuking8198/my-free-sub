name: Auto Generate Clash Config

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: pip install requests -q

      - name: Run Python script
        run: python main.py
        continue-on-error: true  # 脚本报错不直接终止流程

      - name: Push generated file
        run: |
          git config --global user.name "actions-user"
          git config --global user.email "actions@github.com@users.noreply.github.com"
          git add clash.yaml
          # 没有文件变更就直接退出，不报错
          git diff --cached --quiet || git commit -m "Update clash subscription" && git push
