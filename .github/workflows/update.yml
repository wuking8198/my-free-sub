name: Auto Crawl & Update Clash Subscription

# 触发：手动运行 + 每天北京时间凌晨2点自动抓取更新
on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * *'

jobs:
  crawl-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install required package
        run: pip install requests -q

      - name: Execute crawl & convert script
        run: python main.py
        continue-on-error: true

      - name: Commit & Push updated clash.yaml
        run: |
          git config --global user.name "actions-user"
          git config --global user.email "actions@github.com@users.noreply.github.com"
          git add clash.yaml
          # 无文件变更直接跳过提交，避免报错
          git diff --cached --quiet || git commit -m "Auto update nodes $(date '+%Y-%m-%d')" && git push
          git add clash.yaml
          # 没有文件变更就直接退出，不报错
          git diff --cached --quiet || git commit -m "Update clash subscription" && git push
